<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Load Posts</h1>
    <table border="1" cellpadding="0">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!--Load Dynamic Data Here-->
             
        </tbody>
    </table>
    <script>
        function loadData() {
            fetch("https://jsonplaceholder.typicode.com/users")
                .then(response => response.json())
                .then(data=>{
                    const tbody=document.getElementById("tableBody");
                    tbody.innerHTML="" ; //clear old rows
                    data.forEach(user=>{
                        const row= `<tr> 
                            <td>${user.id} </td>
                            <td>${user.name} </td>
                            <td>${user.username} </td>
                            <td>${user.email} </td>
                            </tr>
                            `
                            tbody.innerHTML +=row;

                    })
                })
                .catch(error => console.error(error))
                // get the data here and load in the table
        }
        loadData();
    </script>


</body>

</html>
