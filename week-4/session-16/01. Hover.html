<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
           
            border-radius: 10px;
        }
        .container img{
            width: 25%;
            height: 25%;
        }
        img:hover{
            opacity: 0.5;
          
        }
        .box{
            width: 150px;
            height: 150px;
            background: teal;
            transition: all 0.5s ease ;  /*transition: property timing effect delay*/

        }
        .box:hover{
            width: 200px;
            height: 200px;
            background: orange;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <h1>Smooth Transition: all</h1>
    <div class="container">
        <!-- GRID ITEMS -->
        <img src="https://picsum.photos/id/1015/400/300" alt="img">
        
  
    </div>

    <div class="box"></div>
    
</body>
</html>
