<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            padding: 12px 25px;
            background: royalblue;
            color: white;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: background 0.4s, transform 0.3s;
        }
        button:hover{
            background: dodgerblue;
            transform: scale(1.1);
        }

    </style>
</head>
<body>

    <button>Hover Me</button>
    
</body>
</html>
