<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 150px;
            height: 150px;
            background: red;

            /*Apply Animation*/
            animation-name: changeColor;
            animation-duration: 5s;
        }

        /*KEYFRAME DEFINING START & END*/
        @keyframes changeColor{
            from {background: red;}
            to {background: blue;}
        }
    </style>
</head>
<body>

    <h2>Simple KeyFrame Animation</h2>
    <div class="box"></div>
    
</body>
</html>
