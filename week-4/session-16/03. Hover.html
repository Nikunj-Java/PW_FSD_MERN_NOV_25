<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .box{
            width: 150px;
            height: 150px;
            background: purple;
            transition: initial ;  /*removes any transition*/
            margin-bottom: 20px;

        }
        .box:hover{
            width: 200px;
            background: pink;
        }
    </style>
</head>
<body>

    <h1>Transition: Initial</h1>
     

    <div class="box"></div>
    
</body>
</html>
