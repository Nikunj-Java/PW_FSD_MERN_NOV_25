<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .parent{
            transition:  all 1s ease;
            display: inline-block;
        }
        .child{
            width: 150px;
            height: 150px;
            background: green;
            transition: inherit;  /* child inherits transition*/
        }
        .parent:hover .child{
            width: 250px;
            background: lightgreen;
        }
     
    </style>
</head>
<body>

    <h1>Transition: inherit</h1>
     

    <div class="parent">
        <div class="child"></div>
    </div>
    
</body>
</html>
