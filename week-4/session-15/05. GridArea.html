<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-columns: repeat(3, 100px);
            grid-gap: 10px;
        }
        .item1{
            background: crimson;
            grid-area: 1 / 1 / 3 /3;
            /*Row Start1, Column start 1, Row end 3, column end 3*/
        }
        .item2{background: teal;}
        .item3{background: orange;}
        .item4{background: purple;}

        .grid-item{
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }


    </style>
</head>
<body>
    
    <h2>Grid Area (Numeric) Example</h2>
    <div class="container">
        <div class="grid-item item1">1</div>
        <div class="grid-item item2">2</div>
        <div class="grid-item item3">3</div>
        <div class="grid-item item4">4</div>
    </div>
</body>
</html>
