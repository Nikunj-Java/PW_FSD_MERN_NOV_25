<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .img1 img {
        width: 300px;
        opacity: 1;
        border: 2px solid black;
    }
     .img2 img {
        width: 300px;
        opacity: 0.5;
         border: 2px solid black;
    }
     .img3 img {
        width: 300px;
        opacity: 0;
         border: 2px solid black;
    }
</style>

<body>

    <h2>Opacity Example</h2>
    <h3>Fully Visible(opacity 1)</h3>
    <div class="img1">
        <img src="https://images.pexels.com/photos/262978/pexels-photo-262978.jpeg?cs=srgb&dl=pexels-pixabay-262978.jpg&fm=jpg"
            alt="test image">

    </div>

    <h3>50% Visible(opacity 0.5)</h3>
    <div class="img2">
        <img src="https://images.pexels.com/photos/262978/pexels-photo-262978.jpeg?cs=srgb&dl=pexels-pixabay-262978.jpg&fm=jpg"
            alt="test image">

    </div>

    <h3>Invisible(opacity 0)</h3>
    <div class="img3">
        <img src="https://images.pexels.com/photos/262978/pexels-photo-262978.jpeg?cs=srgb&dl=pexels-pixabay-262978.jpg&fm=jpg"
            alt="test image">

    </div>
</body>

</html>
