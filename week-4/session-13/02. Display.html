<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .box {
        padding: 10px;
        background-color: lightblue;
        margin: 5px;
        border: 2px solid black;
    }
    .block{
        display: block;
    }
    .inline{
        display: inline;
    }
    .inline-block{
        display: inline-block;
        width: 120px;
        height: 40px;
    }
    </style>
</head>
<body>

    <h2>Block Example</h2>
    <div class="box block">Block 1</div>
    <div class="box block">Block 2</div>

    <h2>Inline Example</h2>
    <span class="box inline">Inline 1</span>
    <span class="box inline">Inline 2</span>

    <h2>Inline-Block Example</h2>
    <span class="box inline-block">Inline-Block 1</span>
    <span class="box inline-block">Inline-Block 2</span>
    
</body>
</html>
