<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 20px;
    padding: 20px;
    background: #eee;
  }
  .item {
    background: teal;
    color: white;
    padding: 20px;
    font-size: 22px;
    flex: 1;
    text-align: center;
  }
</style>
</head>
<body>

<h2>Flexbox Demo</h2>
<div class="container">
  <div class="item">🍩 Donut</div>
  <div class="item">🍰 Cake</div>
  <div class="item">🥐 Croissant</div>
</div>

</body>
</html>
