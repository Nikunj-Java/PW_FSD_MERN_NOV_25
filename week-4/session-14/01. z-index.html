<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1,.box2,.box3{
            width: 150px;
            height: 150px;
            position: absolute;
            opacity: 0.85;
        }
        /*Background box*/
        .box1{
            background:blue;
            top: 30px;
            left: 30px;
            z-index: 1;
            
        }
        .box2{
            background:blue;
            top: 60px;
            left: 60px;
            z-index: 2;
            
        }
        .box3{
            background:green;
            top: 90px;
            left: 90px;
            z-index: 3;
            
        }
    </style>
</head>
<body>

    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    
</body>
</html>
