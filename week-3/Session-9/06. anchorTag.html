<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Anchor Tag Example</h1>

    <h2>1. Basic Anchor Tag Example</h2>
    <a href="https://www.google.com">Google.Com</a>
    
    <h2>2. Open Link In a NEW TAB</h2>
    <a href="https://www.google.com" target="_blank">Google.Com</a><br>
    <a href="https://www.facebook.com" target="_self">Facebook.Com</a><br>

    <h2>3. Used as File Download</h2>
    <a href="files/test.png" download>Download Image</a>

    <h2>4. Used as Email Link</h2>
    <a href="mailto:example@example.com">Send Email</a>

    <h2>5. Used as Phone Link</h2>
    <a href="tel:+1234567890">Call Now</a>

    <!--for single page application it can jumps to section-->
    <h2>6. Used as Section Link</h2>
    <a href="#contact">Go to Contact Section</a>
</body>
</html>
