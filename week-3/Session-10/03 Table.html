<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div style="background-color: aliceblue;">
        <h1>Table Example</h1>
        <table border="5px" cellpadding="10px" cellspacing="5px">
            <thead style="background-color: orange;">
                
                    <th>Id</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>City</th>
               
            </thead>
            <tbody style="background-color: lightgray;">
                <tr>
                    <td>1</td><td>John Doe</td><td>30</td><td>New York</td>
                </tr>
                <tr>
                    <td>2</td><td>Alice</td><td>30</td><td>UK</td>
                    
                </tr>
                <tr>
                    <td>3</td><td>Alex</td><td>30</td><td>US</td>
                    
                </tr>
                <tr>
                    <td>4</td><td>Bob</td><td>30</td><td>Netherland</td>
                </tr>
                <tr>
                    <td>5</td><td>Vasco</td><td>30</td><td>Africa</td>
                </tr>
            </tbody>
        </table>

    </div>

    <!--Conclusion-->
    <div>
        <!--table tag-->
        <table>
            <!--thead tag-->
            <thead>
                <!--th tag-->
                <th></th>
            </thead>
            <!--tbody tag-->
            <tbody>
               <!--table row-->
                <tr>
                    <!--table data-->
                    <td></td>
                </tr>
               
            </tbody>
        </table>
    </div>
    
</body>
</html>
