<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Media Tags Example</h1>
        <h2>Audio Example</h2>
        <audio controls>
            <source src="files/myaudio.mp3" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>
        <h2>Video Example</h2>
        <video width="400" controls>
            <source src="files/your_video_source.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    
</body>
</html>
