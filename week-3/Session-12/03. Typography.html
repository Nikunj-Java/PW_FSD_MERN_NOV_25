<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family:Georgia, 'Times New Roman', Times, serif;
        }
        p{
            font-size:18px;
            
        }
        .weight{
            font-weight: bold; /* 100-1000*/
        }
        .style{
            font-style: italic; /* normal, italic, oblique */
        }
        .linehight{
            line-height: 5; /* normal, number, length, percentage */
        }
        div h3{
            text-align: center;
        }
        .transformation{
            text-transform: uppercase; /* capitalize, uppercase, lowercase, none */
        }
        h5{
            text-decoration: underline; /* underline, overline, line-through, none */
        }
        .spacing{
            letter-spacing: 5px; /* normal, length */
        }
        .word-spacing{
            word-spacing: 10px; /* normal, length */
        }

    </style>
</head>
<body>

    <div>
        <h1> Typography Example</h1>
        <p>This is a paragraph demonstrating the use of different typography styles in HTML and CSS.</p>
        <p class="weight">Font weight Example</p>
        <p class="style">Font style Example</p>
        <p class="linehight">Line height Example</p>
    </div>
    
    <div>
        <h3>Text Align Example</h3>
        <h4 class="transformation">This is Text Transformation Example</h4>
        <h5>Text Decoration Example</h5>
        <p class="spacing">Letter Spacing Example</p>
        <p class="word-spacing">Word Spacing Example</p>
    </div>
</body>
</html>
