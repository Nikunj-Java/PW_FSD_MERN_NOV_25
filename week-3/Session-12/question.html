<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Vs Star Selector</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 20px;
        }
        *{
            margin: 0;
            padding: 0;
            color: red;
        }
       
        
    </style>
</head>
<body>
    <h1>Body Vs Star Selector</h1>
    <p>This is a paragraph to demonstrate the difference between body and star selectors in CSS.</p>
    <p>Body selector applies styles to the entire body of the document, while star selector applies styles to all elements within the document.</p>
    <button>Click Me</button>
</body>
</html>
