<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p,h2,a {
            color: blue;
            font-family: Arial, sans-serif;
            border: 1px solid black;
            padding: 5px;
        }

    </style>
</head>
<body>

    <div>
        <h1>Group Selector Example</h1>
        <p>This paragraph will be styled using a group selector.</p>
        <a href="#">This link will also be styled using the same group selector.</a>
        <h2>This heading will share the same styles as the paragraph and link.</h2>
    </div>
    
</body>
</html>
