<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!--LEFT SIDE SIDEBAR-->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>WhatsApp</h3>
            </div>
            <div class="chat-list">
                <div class="chat active">
                    <h4>Nikunj</h4>
                    <p>Hello!</p>
                </div>
                <div class="chat">
                    <h4>Shushant</h4>
                    <p>How Are You!</p>
                </div>

                <div class="chat">
                    <h4>Rahul</h4>
                    <p>Meeting at 5!</p>
                </div>

                <div class="chat">
                    <h4>Siddharth</h4>
                    <p>Hello!</p>
                </div>

                <div class="chat">
                    <h4>Harsh</h4>
                    <p>i am not coming!</p>
                </div>
                <div class="chat">
                    <h4>Baiju</h4>
                    <p>i love Coding!</p>
                </div>

            </div>
        </div>
        <!--RIGHT SIDE AREA-->
        <div class="chat-area">
            <div class="chat-header">
                <h4>Nikunj</h4>
            </div>

            <div class="messages">
                <div class="message received">Hi!</div>
                <div class="message sent">Hello Nikunj👋</div>
                <div class="message received">How Are you!</div>

            </div>

            <div class="chat-input">
                <input type="text" placeholder="Type a Message">
                <button>Send</button>

            </div>
        </div>
    </div>

</body>

</html>
