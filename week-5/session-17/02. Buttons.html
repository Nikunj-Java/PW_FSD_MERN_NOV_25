<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .btn{
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }

        /*Primary Buttons*/
        .primary{
            background-color: #007bff; /*light Blue*/

        }
        .primary:hover{
            background-color: #0056b3;/*Dark Blue*/
        }
        /*success button*/
        .success{
            background-color: #28a745; /*light Green*/
        }
        .success:hover{
            background-color: #1e7e34; /*Dark Green*/
        }
        /*Danger Button*/
        .danger{
            background-color: #dc3545; /*Light Red*/
        }
        .danger:hover{
            background-color: #a71d2a; /*Dark Red*/
        }

    </style>
</head>
<body>

    <h2>Button Types Example</h2>

    <button class="btn primary">Primary</button>
    <button class="btn success">Success</button>
    <button class="btn danger">Danger</button>

    
</body>
</html>
